name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish win-x64 executable
        run: dotnet publish -c Release -r win-x64 --self-contained true -o publish

      - name: Package ZIP archive
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath GeminiUsageMonitor-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiUsageMonitor-win-x64
          path: GeminiUsageMonitor-win-x64.zip

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GeminiUsageMonitor-win-x64.zip
          generate_release_notes: true
